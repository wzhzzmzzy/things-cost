[package]
name = "things-cost"
version = "0.1.2"
edition = "2024"
description = "物品日均花费统计工具"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/your-username/things-cost"
keywords = ["cost", "daily", "statistics", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "things-cost"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "Your Name <your.email@example.com>"
copyright = "2024, Your Name"
license-file = ["LICENSE-MIT", "LICENSE-APACHE"]
extended-description = """
一个简单的命令行工具，用于统计物品的日均消费成本。
可以跟踪物品的购买日期、价格和使用时长，计算每日平均成本。
"""
assets = [["target/release/things-cost", "/usr/bin/", "755"]]

[package.metadata.msi]
license = "LICENSE-MIT"

[package.metadata.wix]
language = "en-US"
upgrade-guid = "YOUR-GUID-HERE"

[package.metadata.binstall]
pkg-url = "https://github.com/your-username/things-cost/releases/download/v{{version}}/things-cost-v{{version}}-{{target}}.tar.gz"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
tabled = "0.14"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"

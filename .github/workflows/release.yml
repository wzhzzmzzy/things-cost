name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.runner || matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-latest
            arch: x86_64
            runner: macos-latest
          - os: macos-latest
            arch: aarch64
            runner: macos-latest
          - os: windows-latest
            arch: x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Make executable (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: chmod +x target/release/things-cost


      - name: Create zip archive
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            zip -j things-cost-linux-x86_64.zip target/release/things-cost
          elif [ "${{ matrix.os }}" = "macos-latest" ] && [ "${{ matrix.arch }}" = "x86_64" ]; then
            zip -j things-cost-macos-x86_64.zip target/release/things-cost
          elif [ "${{ matrix.os }}" = "macos-latest" ] && [ "${{ matrix.arch }}" = "aarch64" ]; then
            zip -j things-cost-macos-aarch64.zip target/release/things-cost
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            zip -j things-cost-windows-x86_64.zip target/release/things-cost.exe
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ matrix.os == 'ubuntu-latest' && 'things-cost-linux-x86_64.zip' || '' }}
            ${{ matrix.os == 'macos-latest' && matrix.arch == 'x86_64' && 'things-cost-macos-x86_64.zip' || '' }}
            ${{ matrix.os == 'macos-latest' && matrix.arch == 'aarch64' && 'things-cost-macos-aarch64.zip' || '' }}
            ${{ matrix.os == 'windows-latest' && 'things-cost-windows-x86_64.zip' || '' }}
          retention-days: 5

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download CI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded artifacts
        run: find artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}

            ## Downloads
            - Linux x86_64: `things-cost-linux-x86_64.zip`
            - macOS Intel (x86_64): `things-cost-macos-x86_64.zip`
            - macOS Apple Silicon (aarch64): `things-cost-macos-aarch64.zip`
            - Windows x86_64: `things-cost-windows-x86_64.zip`

            ## macOS Installation

            - Download macOS binary zip
            - Run `xattr -c ./things-cost-macos-<your_arch>.zip`
            - Extract zip
            - Run `./things-cost`
          files: |
            artifacts/binary-ubuntu-latest-x86_64/things-cost-linux-x86_64.zip
            artifacts/binary-macos-latest-x86_64/things-cost-macos-x86_64.zip
            artifacts/binary-macos-latest-aarch64/things-cost-macos-aarch64.zip
            artifacts/binary-windows-latest-x86_64/things-cost-windows-x86_64.zip
          draft: false
          prerelease: false

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download CI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded artifacts
        run: find artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}

            ## Binaries
            - Linux: `things-cost`
            - macOS: `things-cost`
            - Windows: `things-cost.exe`
          files: |
            artifacts/binary-ubuntu-latest/things-cost
            artifacts/binary-macos-latest/things-cost
            artifacts/binary-windows-latest/things-cost.exe
          draft: false
          prerelease: false